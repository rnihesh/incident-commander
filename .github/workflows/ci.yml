name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      falkordb:
        image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
        env:
          FALKORDB_ARGS: "TIMEOUT_DEFAULT 10000 TIMEOUT_MAX 60000 THREAD_COUNT 4"
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - name: Seed the world graph (tests copy seed:world) and check determinism
        run: |
          uv run ic seed --seed 42 | tee seed.log
          want=$(grep -oE '[0-9a-f]{64}' ../docs/security.md | head -1)
          grep -q "content hash: $want" seed.log || { echo "seed 42 hash drifted from docs/security.md ($want)"; exit 1; }
      - run: uv run pytest -q

  web:
    name: Web (lint + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
